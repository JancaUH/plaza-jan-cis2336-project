<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>ArtConnect - Submission Form</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <h1> ArtConnect</h1>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="gallery.html">Gallery</a>
        <a href="events.html">Events</a>
        <a href="submit.html">Artist Submission</a>
        <a href="faq.html">FAQ</a>
        <a href="references.html">References</a>
    </nav>

    <section>
       <h2>Submission Form</h2>

        <form id="submissionForm">

            <label for="name">Artist Name:</label>
            <input type="text" id="name" name="name">
            <span class="error" id="nameError"></span><br>

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" required>
            <span class="error" id="emailError"></span><br>

            <label for="title">Artwork Title:</label>
            <input type="text" id="title" name="title" required>
            <span class="error" id="titleError"></span><br>

            <label for="title">Category:</label><br>
            <input type="radio" id="photography" name="category" value="Photography">
            <label for="html">Photography</label><br>
            <input type="radio" id="artworkCategory" name="category" value="Artwork">
            <label for="artworkCategory">Artwork</label><br>

    
            <label for="title">Price:</label>
            <input type="text" id="price" name="price" required>
            <span class="error" id="priceError"></span><br>

            <label for="title">Description:</label>
            <input type="text" id="description" name="description" required>
            <span class="error" id="descriptionError"></span><br>

            <label for="artwork">Artwork:</label>
            <input type="file" id="artwork" name="artwork" required><br>

            <button type="submit">Submit</button><br>
        </form>
    </section>
</body>

    <script>
document.addEventListener('DOMContentLoaded', function () {

    const form = document.getElementById('submissionForm');

    if (!form) {
        console.error('Could not find submissionForm');
        return;
    }

    form.addEventListener('submit', async function (event) {

        event.preventDefault();

        console.log('Form submission started');

        document.querySelectorAll('.error').forEach(function (error) {
            error.textContent = '';
        });

        let valid = true;

        const name = document.getElementById('name').value.trim();
        const email = document.getElementById('email').value.trim();
        const title = document.getElementById('title').value.trim();
        const price = document.getElementById('price').value.trim();
        const description = document.getElementById('description').value.trim();
        const artworkFile = document.getElementById('artwork').files[0];

        if (name === '') {
            document.getElementById('nameError').textContent =
                'Artist name is required.';
            valid = false;
        }

        if (title === '') {
            document.getElementById('titleError').textContent =
                'Artwork title is required.';
            valid = false;
        }

        if (description === '') {
            document.getElementById('descriptionError').textContent =
                'Description is required.';
            valid = false;
        }

        if (email === '') {
            document.getElementById('emailError').textContent =
                'Email is required.';
            valid = false;
        } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
            document.getElementById('emailError').textContent =
                'Enter a valid email address.';
            valid = false;
        }

        if (price === '') {
            document.getElementById('priceError').textContent =
                'Price is required.';
            valid = false;
        } else if (isNaN(price)) {
            document.getElementById('priceError').textContent =
                'Price must be a number.';
            valid = false;
        }

        if (!artworkFile) {
            alert('Please select an artwork image.');
            valid = false;
        }

        if (!valid) {
            return;
        }

        try {

            const formData = new FormData(form);

            console.log('Sending artwork to backend...');

            const response = await fetch('/api/artworks', {
                method: 'POST',
                body: formData
            });

            const result = await response.json();

            console.log('Backend response:', result);

            if (response.ok) {

                alert('Artwork submitted successfully!');

                form.reset();

            } else {

                alert(result.message || 'Submission failed.');

            }

        } catch (err) {

            console.error('Submission error:', err);

            alert('An error occurred while submitting.');

        }
    });
});
</script>
</html>>
