<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>ArtConnect - Home</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<script>
    document.getElementById("submissionForm").addEventListener("submit", function(event) {

        document.querySelectorAll(".error").forEach(function(error){
            error.textContent = "";
        });

        let valid = true;

        let name = document.getElementById("name").value.trim();
        let email = document.getElementById("email").value.trim();
        let title = document.getElementById("title").value.trim();
        let price = document.getElementById("price").value.trim();
        let description = document.getElementById("description").value.trim();

        if (name === "") {
            document.getElementById("nameError").textContent = "Artist name is required.";
            valid = false;
        }

        if (title === "") {
            document.getElementById("titleError").textContent = "Artwork title is required.";
            valid = false;
        }

        if (description === "") {
            document.getElementById("descriptionError").textContent = "Description is required.";
            valid = false;
        }

        let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        if (email === "") {
            document.getElementById("emailError").textContent = "Email is required.";
            valid = false;
        } else if (!emailPattern.test(email)) {
            document.getElementById("emailError").textContent = "Enter a valid email address.";
            valid = false;
        }

        if (price === "") {
            document.getElementById("priceError").textContent = "Price is required.";
            valid = false;
        } else if (isNaN(price)) {
            document.getElementById("priceError").textContent = "Price must be a number.";
            valid = false;
        }

        if (valid) {
            alert("Artwork submitted successfully!");
            document.getElementById("submissionForm").reset();
        }

    });
</script>

<body>
    <header>
        <h1> ArtConnect</h1>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="gallery.html">Gallery</a>
        <a href="events.html">Events</a>
        <a href="submit.html">Artist Submission</a>
        <a href="faq.html">FAQ</a>
        <a href="references.html">References</a>
    </nav>

    <section>
       <h2>Submission Form</h2>

        <form id="submissionForm">

            <label for="name">Artist Name:</label>
            <input type="text" id="name" name="name">
            <span class="error" id="nameError"></span><br>

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" required>
            <span class="error" id="emailError"></span><br>

            <label for="title">Artwork Title:</label>
            <input type="text" id="title" name="title" required>
            <span class="error" id="titleError"></span><br>

            <label for="title">Category:</label><br>
            <input type="radio" id="photography" name="category" value="photography">
            <label for="html">Photography</label><br>
            <input type="radio" id="artwork" name="category" value="artwork">
            <label for="css">Artwork</label><br>

        
            
            <label for="title">Price:</label>
            <input type="text" id="price" name="price" required>
            <span class="error" id="priceError"></span><br>

            <label for="title">Description:</label>
            <input type="text" id="description" name="description" required>
            <span class="error" id="descriptionError"></span><br>

            <label for="artwork">Artwork:</label>
            <input type="file" id="artwork" name="artwork" required><br>

            <button type="submit">Submit</button><br>
        </form>
    </section>
</body>
</html>>
